        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  compliance-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/compliance-service:${IMAGE_TAG:-latest}
    container_name: medagent-compliance
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  audit-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/audit-service:${IMAGE_TAG:-latest}
    container_name: medagent-audit
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  hcp-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/hcp-service:${IMAGE_TAG:-latest}
    container_name: medagent-hcp
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
