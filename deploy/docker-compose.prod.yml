# ==============================================
# MedAgent 生产环境 docker-compose
# 使用阿里云 ACR 镜像，不本地构建
# ==============================================
#
# 运行方式（2026-08-13 修复：env_file 与插值的路径基准说明）：
#   - 各服务 env_file 写的是 ../.env（相对本文件所在目录 deploy/ 解析 → 仓库根 .env）；
#   - ${DB_PASSWORD:?} 等插值只从 shell 环境变量 / --env-file 读取，而 --env-file
#     的相对路径以当前工作目录为基准 —— 两者基准不同，运行命令须配套：
#       在仓库根目录执行：
#         docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d
#       或在 deploy/ 目录执行：
#         docker compose --env-file ../.env -f docker-compose.prod.yml up -d
#   - 生产 .env 需按 .env.example 补齐以下键（本文件 ${VAR:?...} 强制必填，
#     缺失时 compose config / up 直接报错拒绝启动，不会带病上线）：
#       DB_USER（有默认值 medagent，可省）/ DB_PASSWORD / REDIS_PASSWORD / AUDIT_DB_PASSWORD
#
# ⚠️ DB_USER 与 init_db.sql 的 REVOKE 角色一致性：
#   scripts/init_db.sql:173 `REVOKE ... FROM medagent` 硬编码角色名 medagent。
#   本文件允许用 ${DB_USER:-medagent} 自定义，若改为其他值：
#   1) init_db.sql 里的 REVOKE 会因为角色不存在而报错（整个 init 脚本失败）；
#   2) 002_audit_immutable.sql 里的 REVOKE/GRANT 也是硬编码 medagent，权限收紧失效。
#   因此默认保持 medagent 不变；确需改名时必须同步修改 init_db.sql 与
#   scripts/migrations/002_audit_immutable.sql 中的角色名。
#
# ⚠️ 002 审计不可篡改迁移（与 dev compose 相同）：首次部署后手动执行一次
#   docker exec -i medagent-postgres psql -U ${DB_USER:-medagent} medagent \
#     -v audit_password='<AUDIT_DB_PASSWORD>' < scripts/migrations/002_audit_immutable.sql
#   执行前 audit-service 无法启动（AUDIT_DATABASE_URL 指向的角色尚不存在，:? 强制必填拦截）。
#   生产环境审计写入只有在 002 执行后才真正生效（medagent 对 audit_logs 仅 SELECT）。

# 容器内网地址（生产环境 .env 里是 localhost，容器内必须覆盖成 compose 服务名 +
# 带密码的连接串，否则按模板部署所有服务都连不上 DB/Redis）
x-internal-urls: &internal-urls
  DATABASE_URL: postgresql://${DB_USER:-medagent}:${DB_PASSWORD:?DB_PASSWORD 必须设置}@postgres:5432/medagent
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}@redis:6379/0
  GATEWAY_URL: http://gateway:8000
  AUTH_SERVICE_URL: http://auth-service:8007
  SPECIALIST_SERVICE_URL: http://specialist-service:8001
  VISIT_SERVICE_URL: http://visit-service:8002
  KNOWLEDGE_SERVICE_URL: http://knowledge-service:8003
  COMPLIANCE_SERVICE_URL: http://compliance-service:8004
  AUDIT_SERVICE_URL: http://audit-service:8005
  HCP_SERVICE_URL: http://hcp-service:8006

services:
  postgres:
    image: postgres:15
    container_name: medagent-postgres
    restart: always
    environment:
      POSTGRES_DB: medagent
      POSTGRES_USER: ${DB_USER:-medagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # S5（2026-08-13）：8 个服务共享连接池（shared db_session pool_size=10 +
    # max_overflow=20，单 worker 上限 30 连接；各服务 Dockerfile 以 --workers 2
    # 起 16 个 worker），峰值远超 PG 默认 max_connections=100，并发打满时各服务
    # 报 "too many clients" 连锁故障。上调至 300（8 服务理论上限 480 内按并发
    # 实际情况留出 PG 自身/维护连接余量；如再扩 worker 需同步再评估）。
    command: postgres -c max_connections=300
    # S8：不映射公网端口 —— 数据库只在 compose 内部网络可达（由网关/服务访问）
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init_db.sql 在仓库的 scripts/ 下，不在 deploy/ —— 原来的 ./init_db.sql 指向不存在的文件，
      # 会被 Docker 当成目录挂载，导致生产库从来没被初始化过
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: medagent-redis
    restart: always
    # S8：不映射公网端口 + requirepass 认证（REDIS_PASSWORD 必填，未设置则拒绝启动）
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  gateway:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/gateway:${IMAGE_TAG:-latest}
    container_name: medagent-gateway
    restart: always
    ports:
      - "8000:8000"
    env_file: ../.env
    environment: *internal-urls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  auth-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/auth-service:${IMAGE_TAG:-latest}
    container_name: medagent-auth
    restart: always
    env_file: ../.env
    environment:
      <<: *internal-urls
      AUTH_DEV_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  specialist-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/specialist-service:${IMAGE_TAG:-latest}
    container_name: medagent-specialist
    restart: always
    env_file: ../.env
    environment: *internal-urls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  visit-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/visit-service:${IMAGE_TAG:-latest}
    container_name: medagent-visit
    restart: always
    env_file: ../.env
    environment: *internal-urls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  knowledge-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/knowledge-service:${IMAGE_TAG:-latest}
    container_name: medagent-knowledge
    restart: always
    env_file: ../.env
    environment: *internal-urls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  compliance-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/compliance-service:${IMAGE_TAG:-latest}
    container_name: medagent-compliance
    restart: always
    env_file: ../.env
    environment:
      <<: *internal-urls
      # 容器内 shared 在 /app/shared，规则文件路径必须显式指定（与 dev compose 一致）
      RULES_YAML_PATH: /app/shared/compliance-rules/rules.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  audit-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/audit-service:${IMAGE_TAG:-latest}
    container_name: medagent-audit
    restart: always
    env_file: ../.env
    environment:
      <<: *internal-urls
      # 审计服务用专用低权账号（002_audit_immutable.sql 创建，仅 INSERT/SELECT）。
      # ${AUDIT_DB_PASSWORD:?...} 强制必填：未定义时 compose 直接报错，避免用空密码静默连库；
      # 002 未执行时角色尚不存在，audit-service 无法启动 —— 先手动执行 002 再起服务。
      AUDIT_DATABASE_URL: postgresql://medagent_audit:${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD 必须设置（= 002_audit_immutable.sql 创建 medagent_audit 时使用的密码）}@postgres:5432/medagent
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  hcp-service:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/medagent/hcp-service:${IMAGE_TAG:-latest}
    container_name: medagent-hcp
    restart: always
    env_file: ../.env
    environment: *internal-urls
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
