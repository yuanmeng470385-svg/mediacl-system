# MedAgent web 管理后台 — nginx 站点配置
# 用法：dist 上服务器后，把本文件放 /etc/nginx/conf.d/medagent-web.conf，
#       按需改 server_name 与 root，然后 nginx -t && nginx -s reload。
# web 是 BrowserRouter（App.tsx），深链路由必须 try_files 回退 index.html。

server {
    listen 80;
    server_name _;  # 改成实际域名或服务器 IP

    # web 构建产物：cd web && npm run build 后把 dist/ 整目录拷上来
    root /var/www/medagent-web/dist;
    index index.html;

    # 患教卡片图片上传等接口走 20m 上限
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带 hash 可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：前端路由（如 /share/twin/:token 公开分享落地页）回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST + WebSocket 统一走网关（vite dev 的 /api、/health 代理在生产的对应物）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WS（数字员工聊天等）透传升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;   # 长问询/SSE/慢接口别被 60s 默认掐断
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
