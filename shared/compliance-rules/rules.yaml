# ============================================
# MedAgent 合规规则库
# 规则类型: keyword(关键词) / regex(正则) / semantic(语义LLM)
# 严重程度: high / medium / low
# 拦截动作: reject(拒绝) / warn(警告) / log(仅记录)
# ============================================

rules:
  - id: "R001"
    name: "禁止承诺疗效"
    type: "keyword"
    patterns:
      - "保证治好"
      - "100%有效"
      - "100% 有效"
      - "吃了就好"
      - "一定能治好"
      - "包治百病"
      - "绝对有效"
      - "肯定能好"
      - "百分之百"
      - "药到病除"
    severity: "high"
    action: "reject"
    description: "禁止对产品疗效做出绝对化承诺或保证"
    enabled: true

  - id: "R002"
    name: "禁止回扣暗示"
    type: "regex"
    patterns:
      - "返[点红]"
      - "提成费"
      - "好处费"
      - "私下给"
      - "给回[扣]"
      - "酬[劳谢]"
    severity: "high"
    action: "reject"
    description: "禁止暗示或讨论回扣、返点等利益输送行为"
    enabled: true

  - id: "R003"
    name: "禁止统方"
    type: "semantic"
    description: "禁止询问或讨论医生处方量、处方数据"
    severity: "high"
    action: "reject"
    enabled: true

  - id: "R004"
    name: "禁止超适应症推广"
    type: "semantic"
    description: "禁止推广超出国家药监局批准药品说明书范围的适应症"
    severity: "high"
    action: "reject"
    enabled: true

  - id: "R005"
    name: "禁止贬低竞品"
    type: "semantic"
    description: "禁止恶意贬低或诋毁竞品产品"
    severity: "medium"
    action: "warn"
    enabled: true

  - id: "R006"
    name: "禁止泄露患者信息"
    type: "semantic"
    description: "禁止在对话中非法收集、使用和传播可识别的患者个人信息及医疗机构内部信息"
    severity: "high"
    action: "reject"
    enabled: true

  - id: "R007"
    name: "禁止讨论未公开数据"
    type: "semantic"
    description: "禁止讨论公司内部未公开的临床试验数据或商业信息"
    severity: "high"
    action: "warn"
    enabled: true

  - id: "R008"
    name: "禁止附加销售条件利益输送"
    type: "regex"
    patterns:
      - "按(销量|销售额|处方量|金额|数量).{0,12}(赞助|捐赠|资助)"
      - "(赞助|捐赠|资助).{0,12}(按|以).{0,8}(销量|销售额|金额|数量)"
      - "(销量|销售额)(达标|达到).{0,12}(赞助|捐赠|资助)"
    severity: "high"
    action: "reject"
    description: "禁止以附加销售药品金额、数量等条件提供捐赠、资助、赞助（2026《医药代表管理办法》）"
    enabled: true

  - id: "R009"
    name: "禁止馈赠财物"
    type: "keyword"
    patterns:
      - "礼品"
      - "礼金"
      - "购物卡"
      - "消费卡"
      - "有价证券"
      - "送红包"
      - "宴请"
      - "安排旅游"
      - "报销差旅"
    severity: "high"
    action: "reject"
    description: "禁止给予礼品、礼金、消费卡（券）、有价证券等财物或安排宴请、旅游（2026《医药代表管理办法》）"
    enabled: true

  - id: "R010"
    name: "禁止隐匿不良反应"
    type: "keyword"
    patterns:
      - "没有副作用"
      - "零副作用"
      - "无不良反应"
      - "绝对安全"
      - "安全性完全没问题"
      - "不良反应不用"
      - "不提不良反应"
    severity: "high"
    action: "reject"
    description: "禁止隐匿药品已知不良反应信息或隐瞒医生反馈的不良反应（2026《医药代表管理办法》）"
    enabled: true

  - id: "R011"
    name: "禁止误导用药"
    type: "semantic"
    severity: "high"
    action: "reject"
    description: "禁止误导医生使用药品、干预或影响临床合理使用药品（2026《医药代表管理办法》）"
    enabled: true
